databases:
  - name: sentient-postgres
    plan: free
    databaseName: sentient
    user: sentient

services:
  - type: web
    name: sentient-api
    runtime: python
    rootDir: sentient_project
    plan: free
    buildCommand: bash build.sh
    # Free Render services do not support pre-deploy commands. start.sh applies
    # migrations before starting Gunicorn instead.
    startCommand: bash start.sh
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: sentient-postgres
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "false"
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: GEMINI_API_KEY
        sync: false
      - key: TAVILY_API_KEY
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: CSRF_TRUSTED_ORIGINS
        sync: false
